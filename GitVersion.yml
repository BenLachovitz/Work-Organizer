# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.24.0: two new
# manual-edit-only shift types, afternoon_early/afternoon_late (migration 53),
# let the roster editor put a guard or an occupies_slot placeholder into just
# S2 or just S3 of the afternoon block, instead of the full 8h afternoon
# shift or a 12h day12/night12 that also commits them to the morning/night.
# Added to the shift catalogue (src/lib/shifts.ts) like any other shift type
# -- coverage counting, rest-hour derivation, and eligibility all fell out
# for free since those are already generic over SHIFT_TYPES/SHIFTS[x].covers,
# not hardcoded to the original five. One real bug caught before shipping:
# mockSolver.ts's candidate-move search also iterates SHIFT_TYPES generically,
# so it started proposing the new half-shifts on its own until a new
# SOLVER_SHIFT_TYPES constant (the original five only) was introduced and
# swapped in -- confirmed fixed via test:compare regaining exact mock/CP-SAT
# parity. RosterGrid.tsx/exportRoster.ts's existing day12/night12 handover-
# pairing widened to include the new types (exportRoster.ts also had a
# latent hardcoded 'day12'/'night12' literal fixed while widening it).
# Bundled on the same feature/placeholder-occupies-slot branch as v2.23.0.
next-version: 2.24.0
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
