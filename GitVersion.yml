# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.22.1: the
# self-service forgot-PIN feature (v2.21.0 WhatsApp, then v2.22.0 pushed to
# a notification-based redesign) is FULLY REVERTED. A session-persistence
# regression appeared in production after it shipped (every page refresh,
# every device, signed out back to Login) that could not be pinned to any
# line of the changes made -- confirmed via full diff, and reproduced even
# on a device with no passkey registered, ruling that gate out too. Ben's
# call: revert to the last confirmed-stable point (the manager-only
# reset-pin tool, v2.20.2) rather than keep debugging a live regression with
# an unconfirmed cause. Migrations 48-50 stay in the repo as historical
# record (they really did run against the live database); migration 51
# reverses their net effect instead of rewriting history.
next-version: 2.22.1
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
