# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.26.0: per-day
# morning target override widened to any day and value 1 (migration 57).
# weekly_morning_target_overrides previously only allowed day_index 1-5
# (weekdays) and morning_target_slots 2-3 -- the same every-day, as-low-as-1
# flexibility weekly_segment_target_overrides already gave S2/S3/S4 (migration
# 37) is now available for morning too: day_index 0-6, values 1-3. The
# week-level baseline toggle (roster_weeks.morning_target_slots) is
# deliberately untouched -- still a strict 2-or-3, weekday-only choice; only
# the per-day exception table got wider. morningTargetForDay() (src/lib/
# shifts.ts, mirrored in solver/models.py) now checks the override map on
# every day before falling back to the weekday-baseline-vs-flat-2 split,
# instead of skipping the lookup outright on a weekend day -- the hard lock
# lived in that early return, not just in the CHECK constraints.
# segmentFloors()'s S1 floor formula needed no change: min(1, morning) already
# produces the correct floor for a value of 1, the same clamp S2/S3/S4 already
# use. As a direct side effect this resolves the Yom Kippur-on-a-Saturday
# limit the previous version (2.25.0) left open: withKippurAdjustments()
# (useGenerateSchedule.ts) no longer skips its effective-target-raise step for
# morning on a weekend Kippur day. One real correctness gap caught before
# shipping: ManagerDashboard.tsx's override-save normalisation compared
# against week.morning_target_slots unconditionally, which is wrong on a
# weekend day whose true baseline is always the flat 2 -- fixed by computing
# the correct per-day baseline before comparing.
next-version: 2.26.0
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
