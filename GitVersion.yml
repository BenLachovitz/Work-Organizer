# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.18.0: reworked
# the login UX per Ben's direction -- remember-me moved from a Preferences
# card onto the Login page itself (under the personal PIN, not the badge
# code), the passkey management card (list/rename/remove) was dropped
# entirely as redundant, and the Login page's passkey button became hybrid:
# signs in directly if this device already has a credential, otherwise
# falls through to a normal badge-code + PIN login and then prompts the
# passkey setup immediately afterward -- the common "sign in with biometrics
# or set one up" pattern from most consumer apps.
next-version: 2.18.0
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
