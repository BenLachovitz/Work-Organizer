# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.25.0: Yom
# Kippur special-coverage feature (migrations 54-56) -- Yom Kippur is a
# driving-prohibited holiday, so 2-3 guards need to cover an unbroken block
# from Kippur eve's early afternoon through the end of Kippur day (excluding
# that final night). Two new manual-edit-only shift types, kippur_day1
# (S2+S3+S4) and kippur_day2 (S1+S2+S3), one row per day -- schedule_
# assignments' one_shift_per_guard_per_day index rules out two ordinary
# same-day rows, which is why this needed new shift types rather than
# reusing existing ones. A standing settings toggle (scheduler_settings.
# kippur_handling_enabled) gates a manager-dashboard guard-picker panel that
# surfaces automatically on whichever week the Hebrew calendar (@hebcal/
# hdate) places Yom Kippur in each year; generation then writes the pair
# automatically for every configured guard (weekly_kippur_guards) from then
# on. The pair lands as exactly 2 shifts against a guard's weekly total for
# free (one row per day, same generic per-row accounting every other shift
# type already uses) -- no special kamut logic needed. The solver solves
# around the pinned block (availability stripped for the two Kippur dates,
# segment targets reduced by the guard count so it doesn't independently
# seek full coverage on top of what the block already provides), and a
# narrowly-scoped rest exemption (classifyRest(), src/lib/shifts.ts) allows
# the 0h gap between the two halves without weakening the rest rule for any
# other pairing. One real bug caught during live testing against the actual
# 2026-09-20 week, which already had S3/S4 overridden to 1 for every day
# (unrelated to Kippur): the Kippur block's own guaranteed coverage was
# itself exceeding that pre-existing, lower ceiling, regardless of anything
# the solver did -- fixed by computing one effective target per affected
# segment (max(real target, guard count)) and raising the REFEREE's ceiling
# to match, since a segment target was never meant to evict guards who are
# mandatorily present. Built on feature/yom-kippur-coverage and merged after
# both the DB migrations and this fix were verified against the live
# project.
next-version: 2.25.0
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
