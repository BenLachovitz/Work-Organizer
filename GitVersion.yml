# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.22.2: fixed
# useVisibleRosters() (src/hooks/useGuardPortal.ts) leaking every historical
# published week into the guard-facing roster pages for a manager+guard
# account (Ben) -- the is_manager() RLS branch has no date floor at all (by
# design, for the /manage archive), so this hook now applies the same
# guard_visible_from()-equivalent floor itself (src/lib/dates.ts's new
# guardVisibleWeekFloor()) instead of trusting RLS alone to narrow it. Also
# fixed RosterView.tsx/GuardHome.tsx mislabeling a genuinely past week (the
# Sunday-morning grace window, or the stale-week symptom above) as "next
# week" / "future week" instead of "last week". No schema/RLS change.
next-version: 2.22.2
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
