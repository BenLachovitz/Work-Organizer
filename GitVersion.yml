# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.23.0: a
# placeholder (guard-less schedule_assignments row, migration 39/§12.9) can
# now optionally be marked occupies_slot -- a new BOOLEAN column, migration
# 52, meaningful only on a placeholder row (CHECK-enforced FALSE on any real
# assignment) -- so it counts toward segment coverage (floor/target/ceiling)
# like a real assignment while still carrying no guard identity, staying
# excluded from availability/rest/one-shift-per-day/the weekly ceiling/any
# guard's own כמות. src/lib/validate.ts's referee gained its first-ever
# guard_id === null branch to support this (coverageBySegment() already
# counted guard-agnostically; only the guard-specific loops needed a skip).
# RosterEditor.tsx/RosterGrid.tsx/exportRoster.ts's existing placeholder-
# exclusion predicates widened accordingly. Default FALSE, so every existing
# placeholder keeps its prior behaviour unchanged.
next-version: 2.23.0
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
