# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.26.1: bug fix, remote
# generation silently fell back to the mock engine. carry_in_shifts() returns
# every row on the previous published Saturday, including placeholder rows
# (guard_id NULL -> key "null", migration 52) and manual-only shift types
# (afternoon_early/late, kippur_day1/2 -- migrations 53/56). The Python
# solver's ShiftType accepts only the five solver types, so it answered 422,
# the edge function 502, and the client quietly ran mockSolve(). Fixed by
# toSolverCarryIn() (src/lib/shifts.ts) on the remote payload only: drop
# placeholder keys, map each manual type onto the solver type with the same
# end time (rest depends only on the previous shift's end, so lossless).
# See spec section 1.29.
next-version: 2.26.1
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
