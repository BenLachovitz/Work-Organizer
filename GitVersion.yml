# GitVersion config (https://gitversion.net).
#
# This repo has no CI pipeline running the actual GitVersion.Tool CLI yet --
# this file exists as the single source of truth for "what version are we
# at," kept in step by hand with package.json's `version` and an annotated
# git tag (`vX.Y.Z`) on the commit that ships each version. That trio is what
# actually enables rollback: `git checkout vX.Y.Z` gets back to exactly the
# state described by that version, matching the spec's own version history
# (dynamic-guard-scheduler-spec.md's changelog).
#
# next-version is the seed GitVersion computes from when no higher version
# can be derived from tags/branch history -- bumped with each shipped
# version (see BACKLOG.md's Versioning section). Currently 2.18.1: the
# hybrid passkey button's fallback now imperatively focuses the code input
# (mobile browsers largely ignore mount-time autoFocus, only a focus() call
# inside a real click) and, more importantly, fires the passkey registration
# ceremony directly from submitPin/submitNewPin right after a successful
# login -- same click's async chain, not deferred to a second tap on the
# GuardHome nudge -- so the flow is now: tap the button with nothing set up
# -> log in with code+PIN -> the Face ID/fingerprint prompt appears on its
# own, no extra tap needed.
next-version: 2.18.1
mode: Mainline
branches:
  main:
    regex: ^main$
    increment: Patch
    is-main-branch: true
tag-prefix: '[vV]'
